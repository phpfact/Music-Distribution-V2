# Production override. Use together with compose.yaml (`make prod-up`).
#
# - The app runs the optimized standalone build as a non-root user on a
#   read-only filesystem with all capabilities dropped.
# - PostgreSQL and Redis publish NO host ports; they are reachable only on the
#   internal network. AIStor publishes only its Console, on 127.0.0.1.
# - pgAdmin and Redis Insight are behind the "tools" profile, so they do not
#   start unless asked for (`make prod-tools-up`), and then only on 127.0.0.1.
# - Database migrations are a one-off job behind the "migrate" profile
#   (`make prod-migrate`); `up` never runs them.
# - The app binds to 127.0.0.1 by default. Terminate HTTPS in a reverse proxy
#   on the host and forward to it (see README, "Production").

services:
  app:
    build:
      target: runner
    image: ${APP_IMAGE:-mdnext-app}:${APP_TAG:-local}
    environment:
      NODE_ENV: production
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
      # Next.js writes its image/data cache here; uid/gid 1000 is the "node" user.
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    volumes:
      # Uploaded files (STORAGE_ROOT), e.g. tenant profile images. The image
      # creates /app/storage owned by "node", so a new volume inherits that.
      - app_storage:/app/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-1.0}"
          memory: ${APP_MEMORY_LIMIT:-512m}

  # One-off job, not a running service: applies pending migrations to the
  # control plane and to every tenant database, then exits. `make prod-seed`
  # runs the seed script in the same image; the platform owner credentials are
  # passed to that one run only and are deliberately not listed here.
  migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
      target: migrator
    image: ${APP_IMAGE:-mdnext-app}:${APP_TAG:-local}-migrate
    init: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in your env file (run 'make init')}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your env file (run 'make init')}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file (run 'make init')}
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - internal

  postgres:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          # If you raise this, raise shared_buffers in postgres/postgresql.conf too.
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}

  redis:
    # Start directly as the unprivileged user (the image's entrypoint would
    # otherwise need root and extra capabilities just to drop them).
    user: redis
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          # Headroom above REDIS_MAXMEMORY for AOF rewrites and snapshots.
          memory: ${REDIS_MEMORY_LIMIT:-512m}

  aistor:
    # The Console only, on this machine only (reach it through an SSH tunnel).
    # The S3 API is not published: services use aistor:9000 inside Docker.
    ports:
      - "127.0.0.1:${AISTOR_CONSOLE_PORT:-9001}:9001"
    # Runs as the image's root user, but read-only and with no capabilities
    # (verified to work). The license file on the host must therefore be
    # readable by root without capabilities: owned by root, or mode 644.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${AISTOR_CPU_LIMIT:-1.0}"
          memory: ${AISTOR_MEMORY_LIMIT:-1g}

  aistor-admin:
    # mc keeps its configuration in /tmp/.mc (MC_CONFIG_DIR in the image).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pgadmin:
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  redisinsight:
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  app_storage:
