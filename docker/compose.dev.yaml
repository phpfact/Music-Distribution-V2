# Development override. Use together with compose.yaml (`make up`).
#
# Adds: the Next.js dev server with hot reload, and host ports for every
# service. All ports bind to 127.0.0.1, so nothing is reachable from other
# machines unless you change APP_BIND_ADDRESS.

services:
  app:
    build:
      target: dev
    image: mdnext-app:dev
    # Hot reload: Turbopack with native file events by default. If edits are
    # not picked up on your host, set NEXT_DEV_BUNDLER=webpack and
    # WATCHPACK_POLLING=true in the env file (see README, "Hot reload").
    command:
      - node_modules/.bin/next
      - dev
      - --${NEXT_DEV_BUNDLER:-turbopack}
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      NODE_ENV: development
      # Only read by the webpack dev server; ignored by Turbopack.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      # Source code, live-edited on the host.
      - ..:/app
      # Kept in volumes rather than on the host: node_modules holds Linux
      # builds of native packages, and .next is rewritten constantly.
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
      - app_npm_cache:/home/node/.npm
      # Hides the AIStor license (minio/ in the project folder, bind-mounted
      # above) from the app: only the aistor service may read it.
      - type: tmpfs
        target: /app/minio
        tmpfs:
          size: 4096
    healthcheck:
      # The first start installs dependencies before the server comes up.
      start_period: 300s
    # A dev server that cannot start should stop and show its error, not loop.
    restart: on-failure:3

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

  aistor:
    ports:
      # S3 API, e.g. for an S3 client on this machine.
      - "127.0.0.1:${AISTOR_HOST_PORT:-9000}:9000"
      # Console (web UI).
      - "127.0.0.1:${AISTOR_CONSOLE_PORT:-9001}:9001"

  pgadmin:
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:8080"

  redisinsight:
    environment:
      # Pre-registers the Redis connection so it appears on first open.
      # Development only: Redis Insight has no login of its own, so anyone who
      # can reach its port gets this connection. In production the connection
      # is added by hand instead (see README).
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: Music Distribution (redis)
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"

volumes:
  app_node_modules:
  app_next:
  app_npm_cache:
