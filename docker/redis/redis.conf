# Redis 8 settings for this stack.
#
# Set on the command line by Compose instead of here, because they come from
# the environment file:
#   --requirepass        REDIS_PASSWORD
#   --maxmemory          REDIS_MAXMEMORY          (default 256mb)
#   --maxmemory-policy   REDIS_MAXMEMORY_POLICY   (default noeviction)

# --- Network -----------------------------------------------------------------
# Reachable only on the internal Docker network; the port is never published
# in production. protected-mode stays on and a password is always required.
bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 300
timeout 0

# --- Persistence -------------------------------------------------------------
# Both mechanisms are enabled, writing to the named volume mounted at /data.
dir /data

# AOF: every write is appended and fsynced once per second, so a crash or
# power loss can lose at most about one second of writes. This is what Redis
# loads on startup when it is enabled.
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB: periodic point-in-time snapshots (dump.rdb), handy to copy off-host.
# Format: save <seconds> <changes>.
save 3600 1 300 100 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
# Refuse writes if a background snapshot fails, rather than silently running
# without working persistence.
stop-writes-on-bgsave-error yes

# --- Memory ------------------------------------------------------------------
# Policy and limit are passed on the command line (see top of file).
# noeviction is the default here: when maxmemory is reached, writes fail with
# an error instead of Redis silently deleting keys. That is the safe choice
# while the data is persisted and its use (cache, queues, sessions) is not yet
# decided. For a pure cache, switch REDIS_MAXMEMORY_POLICY to allkeys-lru.

# --- Logging -----------------------------------------------------------------
loglevel notice
logfile ""
