# PostgreSQL 18 server settings for this stack.
# Loaded with `postgres -c config_file=...`, so it replaces the default file;
# anything not set here uses the built-in default. Changes need a restart
# (`make restart s=postgres`) unless the setting is reloadable.

# --- Connections -------------------------------------------------------------
# Reachable only on the internal Docker network; the port is never published
# in production. Authentication is still required (pg_hba.conf, scram-sha-256).
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# --- Memory ------------------------------------------------------------------
# Sized for a container limited to about 1 GB. Rule of thumb when you raise the
# limit: shared_buffers ~25% of RAM, effective_cache_size ~50-75%.
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# --- Durability --------------------------------------------------------------
# Defaults, stated explicitly: a commit is on disk before it is acknowledged.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# --- Logging (to stderr, collected by Docker) --------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
log_checkpoints = on
log_lock_waits = on
# Statements slower than this are logged in full, including literal values.
# Lower it carefully: query text can contain personal or sensitive data.
log_min_duration_statement = 1000

# --- Locale ------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
